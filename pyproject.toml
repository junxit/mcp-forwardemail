[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forwardemail-mcp"
version = "0.1.0"
description = "Unofficial MCP server for ForwardEmail API - manage domains, aliases, and emails"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jade", email = "jade@example.com" }
]
keywords = [
    "mcp",
    "forwardemail",
    "email",
    "api",
    "claude",
    "ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
forwardemail-mcp = "forwardemail_mcp.server:main"

[project.urls]
Homepage = "https://github.com/junxit/mcp-forwardemail"
Documentation = "https://github.com/junxit/mcp-forwardemail#readme"
Repository = "https://github.com/junxit/mcp-forwardemail"
Issues = "https://github.com/junxit/mcp-forwardemail/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/forwardemail_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
